name: Dependency Policy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-policy:
    name: .NET 10 and dependency policy
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Check package policy
        shell: pwsh
        run: ./scripts/check-package-policy.ps1
      - name: Test package policy rejection cases
        shell: pwsh
        run: ./scripts/test-package-policy.ps1
      - name: Restore and audit all projects
        # The MAUI head needs mobile workloads; Mobile CI restores and audits it with those installed.
        shell: bash
        run: |
          set -euo pipefail
          find src tests tools -name '*.csproj' -not -path 'src/Frontend/Mobile/*' -print0 |
            while IFS= read -r -d '' project; do
              echo "Restoring $project"
              dotnet restore "$project" --force-evaluate -warnaserror:NU1510,NU1605,NU1608,NU1900,NU1901,NU1902,NU1903,NU1904,NU1905
            done
      - name: Restore pinned .NET tools
        run: dotnet tool restore
      - name: Verify formatter compatibility
        run: dotnet run --project tools/LS.SourceFormatting/LS.SourceFormatting.csproj --configuration Release --no-restore -- --self-test
