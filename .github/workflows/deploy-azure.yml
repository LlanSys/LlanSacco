name: Deploy to Azure

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: "Deployment target"
        required: true
        default: app-service
        type: choice
        options:
          - app-service
          - aca-acr
          - aca-ghcr

permissions:
  contents: read
  packages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  API_IMAGE: llan-sacco-api
  BLAZOR_IMAGE: llan-sacco-blazor

jobs:
  setup:
    if: github.event_name == 'workflow_dispatch' && vars.LLANSACCO_DEPLOYMENT_ENABLED == 'true'
    name: Setup deployment target
    runs-on: ubuntu-latest
    environment: azure-prod
    outputs:
      target: ${{ steps.resolve.outputs.target }}
      image_tag: latest
    steps:
      - id: resolve
        run: |
          TARGET="${{ inputs.deployment_target }}"
          if [ -z "$TARGET" ]; then
            TARGET="${{ vars.AZURE_DEPLOYMENT_TARGET || 'app-service' }}"
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: Build & Test
    needs: setup
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore projects
        run: |
          dotnet restore src/Backend/Api/LS.Api/LS.Api.csproj
          dotnet restore src/Frontend/Web/LS.UI.Blazor/LS.UI.Blazor.csproj
          dotnet restore tests/LS.Tests.Architecture/LS.Tests.Architecture.csproj
          dotnet restore tests/LS.Tests.Unit/LS.Tests.Unit.csproj
          dotnet restore tests/LS.Tests.Integration/LS.Tests.Integration.csproj

      - name: Build projects
        run: |
          dotnet build src/Backend/Api/LS.Api/LS.Api.csproj --configuration Release --no-restore
          dotnet build src/Frontend/Web/LS.UI.Blazor/LS.UI.Blazor.csproj --configuration Release --no-restore
          dotnet build tests/LS.Tests.Architecture/LS.Tests.Architecture.csproj --configuration Release --no-restore
          dotnet build tests/LS.Tests.Unit/LS.Tests.Unit.csproj --configuration Release --no-restore
          dotnet build tests/LS.Tests.Integration/LS.Tests.Integration.csproj --configuration Release --no-restore

      - name: Run Architecture Tests
        run: dotnet test tests/LS.Tests.Architecture/LS.Tests.Architecture.csproj --configuration Release --no-restore --no-build

      - name: Run Unit Tests
        run: dotnet test tests/LS.Tests.Unit/LS.Tests.Unit.csproj --configuration Release --no-restore --no-build

      - name: Run Integration Tests
        run: dotnet test tests/LS.Tests.Integration/LS.Tests.Integration.csproj --configuration Release --no-restore --no-build
        env:
          CacheSettings__ConnectionString: "localhost:6379"

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Publish API
        run: dotnet publish src/Backend/Api/LS.Api/LS.Api.csproj --configuration Release --no-restore --no-build --output ./publish-api

      - name: Build EF Core Migration Bundles
        run: |
          ./scripts/migration-bundles.sh build ./publish-api
        env:
          # Bundles do not connect at build time; design-time factories only need a valid PostgreSQL string.
          ConnectionStrings__DefaultConnection: "Host=localhost;Database=llansacco_design;Username=postgres;Password=design-only"

      - name: Publish Blazor UI
        run: dotnet publish src/Frontend/Web/LS.UI.Blazor/LS.UI.Blazor.csproj --configuration Release --no-restore --no-build --output ./publish-ui

      - name: Upload API Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api-app
          path: ./publish-api

      - name: Upload UI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ui-app
          path: ./publish-ui

  run-migrations:
    name: Run DB Migrations
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: azure-prod
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download API Artifacts
        uses: actions/download-artifact@v4
        with:
          name: api-app
          path: ./api-app

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate migration configuration
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_SQL_NETWORK_MODE: ${{ vars.AZURE_SQL_NETWORK_MODE }}
          AZURE_SQL_SERVER_NAME: ${{ vars.AZURE_SQL_SERVER_NAME }}
          AZURE_POSTGRES_CONNECTION_STRING: ${{ secrets.AZURE_POSTGRES_CONNECTION_STRING }}
        run: |
          set -euo pipefail

          required_values=(
            AZURE_SQL_NETWORK_MODE
            AZURE_POSTGRES_CONNECTION_STRING
          )

          for name in "${required_values[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "ERROR: ${name} is not configured for the production GitHub environment."
              exit 1
            fi
          done

          case "$AZURE_SQL_NETWORK_MODE" in
            PublicRunner)
              for name in AZURE_RESOURCE_GROUP AZURE_SQL_SERVER_NAME; do
                if [ -z "${!name:-}" ]; then
                  echo "ERROR: ${name} is required when AZURE_SQL_NETWORK_MODE is PublicRunner."
                  exit 1
                fi
              done
              ;;
            PrivateRunner)
              ;;
            *)
              echo "ERROR: AZURE_SQL_NETWORK_MODE must be PublicRunner or PrivateRunner."
              exit 1
              ;;
          esac

      - name: Allow this runner through the database firewall
        if: vars.AZURE_SQL_NETWORK_MODE == 'PublicRunner'
        id: db-firewall
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_SQL_SERVER_NAME: ${{ vars.AZURE_SQL_SERVER_NAME }}
        run: |
          set -euo pipefail

          runner_ip="$(curl --fail --silent --show-error https://api.ipify.org)"
          rule_name="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          az postgres flexible-server firewall-rule create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_SQL_SERVER_NAME" \
            --rule-name "$rule_name" \
            --start-ip-address "$runner_ip" \
            --end-ip-address "$runner_ip" \
            --output none

          echo "rule_name=$rule_name" >> "$GITHUB_OUTPUT"

      - name: Execute Migration Bundles
        env:
          AZURE_POSTGRES_CONNECTION_STRING: ${{ secrets.AZURE_POSTGRES_CONNECTION_STRING }}
        run: |
          set -euo pipefail

          export TARGET_CONNECTION_STRING="$AZURE_POSTGRES_CONNECTION_STRING"

          export ConnectionStrings__IamConnection="$TARGET_CONNECTION_STRING"
          export ConnectionStrings__HrConnection="$TARGET_CONNECTION_STRING"
          export ConnectionStrings__SharedConnection="$TARGET_CONNECTION_STRING"
          export ConnectionStrings__BankingConnection="$TARGET_CONNECTION_STRING"
          export ConnectionStrings__ControlPlaneConnection="$TARGET_CONNECTION_STRING"
          export ConnectionStrings__DefaultConnection="$TARGET_CONNECTION_STRING"

          bash ./api-app/migration-bundles.sh run ./api-app "$TARGET_CONNECTION_STRING"

      - name: Remove temporary database firewall rule
        if: always() && vars.AZURE_SQL_NETWORK_MODE == 'PublicRunner' && steps.db-firewall.outputs.rule_name != ''
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_SQL_SERVER_NAME: ${{ vars.AZURE_SQL_SERVER_NAME }}
          FIREWALL_RULE_NAME: ${{ steps.db-firewall.outputs.rule_name }}
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_SQL_SERVER_NAME" \
            --rule-name "$FIREWALL_RULE_NAME" \
            --output none \
            --yes

  deploy-app-service-api:
    name: Deploy API to Azure App Service
    needs: [setup, build-and-test, run-migrations]
    if: needs.setup.outputs.target == 'app-service'
    runs-on: ubuntu-latest
    environment: azure-prod
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download API Artifacts
        uses: actions/download-artifact@v4
        with:
          name: api-app
          path: ./api-app

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App (API)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_API_APP_NAME }}
          slot-name: staging
          package: ./api-app

      - name: Swap staging to production (API)
        run: |
          az webapp deployment slot swap \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --name ${{ vars.AZURE_API_APP_NAME }} \
            --slot staging \
            --target-slot production

  deploy-app-service-ui:
    name: Deploy UI to Azure App Service
    needs: [setup, build-and-test, run-migrations]
    if: needs.setup.outputs.target == 'app-service'
    runs-on: ubuntu-latest
    environment: azure-prod
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download UI Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ui-app
          path: ./ui-app

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App (UI)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_UI_APP_NAME }}
          slot-name: staging
          package: ./ui-app

      - name: Swap staging to production (UI)
        run: |
          az webapp deployment slot swap \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --name ${{ vars.AZURE_UI_APP_NAME }} \
            --slot staging \
            --target-slot production
  build-push-containers:
    name: Build & Push Containers
    needs: setup
    if: needs.setup.outputs.target == 'aca-acr' || needs.setup.outputs.target == 'aca-ghcr'
    runs-on: ubuntu-latest
    environment: azure-prod
    env:
      DOCKER_REGISTRY: ''
      DOCKER_NAMESPACE: ''
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            image: llan-sacco-api
            dockerfile: ops/docker/api.Dockerfile
          - service: blazor
            image: llan-sacco-blazor
            dockerfile: ops/docker/blazor.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to Azure with OIDC
        if: needs.setup.outputs.target == 'aca-acr'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        if: needs.setup.outputs.target == 'aca-acr'
        run: |
          az acr login --name ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
          echo "DOCKER_REGISTRY=${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}.azurecr.io" >> $GITHUB_ENV
          echo "DOCKER_NAMESPACE=" >> $GITHUB_ENV

      - name: Login to GHCR
        if: needs.setup.outputs.target == 'aca-ghcr'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set GHCR Environment
        if: needs.setup.outputs.target == 'aca-ghcr'
        run: |
          echo "DOCKER_REGISTRY=ghcr.io" >> $GITHUB_ENV
          echo "DOCKER_NAMESPACE=${{ env.IMAGE_NAMESPACE }}/" >> $GITHUB_ENV

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_NAMESPACE }}${{ matrix.image }}:${{ needs.setup.outputs.image_tag }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_NAMESPACE }}${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy-aca:
    name: Deploy to Azure Container Apps
    needs: [setup, run-migrations, build-push-containers]
    if: needs.setup.outputs.target == 'aca-acr' || needs.setup.outputs.target == 'aca-ghcr'
    runs-on: ubuntu-latest
    environment: azure-prod
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API to ACA (ACR)
        if: needs.setup.outputs.target == 'aca-acr'
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ vars.AZURE_ACA_API_NAME }}
          acrName: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
          imageToDeploy: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}.azurecr.io/${{ env.API_IMAGE }}:sha-${{ github.sha }}

      - name: Deploy UI to ACA (ACR)
        if: needs.setup.outputs.target == 'aca-acr'
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ vars.AZURE_ACA_UI_NAME }}
          acrName: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
          imageToDeploy: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}.azurecr.io/${{ env.BLAZOR_IMAGE }}:sha-${{ github.sha }}

      - name: Deploy API to ACA (GHCR)
        if: needs.setup.outputs.target == 'aca-ghcr'
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ vars.AZURE_ACA_API_NAME }}
          registryUrl: ghcr.io
          registryUsername: ${{ github.actor }}
          registryPassword: ${{ secrets.GHCR_PAT }}
          imageToDeploy: ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ env.API_IMAGE }}:sha-${{ github.sha }}

      - name: Deploy UI to ACA (GHCR)
        if: needs.setup.outputs.target == 'aca-ghcr'
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ vars.AZURE_ACA_UI_NAME }}
          registryUrl: ghcr.io
          registryUsername: ${{ github.actor }}
          registryPassword: ${{ secrets.GHCR_PAT }}
          imageToDeploy: ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ env.BLAZOR_IMAGE }}:sha-${{ github.sha }}

