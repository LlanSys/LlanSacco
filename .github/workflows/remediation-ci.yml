name: Import And Remediation CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remediation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Baseline / ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [Api, Blazor, Unit, Architecture, Integration, Guardrails]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Verify baseline
        shell: pwsh
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASELINE_CHECK: ${{ matrix.check }}
        run: |
          $options = @{ Check = $env:BASELINE_CHECK; Configuration = 'Release' }
          if ($env:BASELINE_CHECK -eq 'Guardrails' -and $env:GITHUB_EVENT_NAME -eq 'pull_request') {
              if (-not $env:PR_BASE_SHA) { throw 'The pull request base SHA is required.' }
              $options.BaseRef = $env:PR_BASE_SHA
          }
          ./scripts/verify-baseline.ps1 @options
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: baseline-${{ matrix.check }}
          path: |
            artifacts/baseline
            artifacts/architecture-inventory
          if-no-files-found: ignore

  secrets:
    name: Baseline / Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download and verify Gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern gitleaks_8.30.1_linux_x64.tar.gz --pattern gitleaks_8.30.1_checksums.txt --dir "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          sha256sum --check --ignore-missing gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz
      - name: Scan committed history
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --redact .'

  startup:
    name: Baseline / Startup
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-Startup-Only-1!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 12
      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: ci
          RABBITMQ_DEFAULT_PASS: ci-startup-only
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 12
    env:
      # Throwaway credentials for ephemeral CI service containers only.
      CI_SQL_PASSWORD: Ci-Startup-Only-1!
      CI_RABBITMQ_PASSWORD: ci-startup-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Start the API with messaging and background jobs enabled
        shell: pwsh
        run: |
          ./scripts/test-app-startup.ps1 `
            -SqlConnectionString "Server=localhost,1433;Database=LlanSaccoStartup;User Id=sa;Password=$env:CI_SQL_PASSWORD;Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True" `
            -RabbitMqHost localhost -RabbitMqPort 5672 -RabbitMqUser ci -RabbitMqPassword $env:CI_RABBITMQ_PASSWORD `
            -RedisConnectionString 'localhost:6379,abortConnect=false'

  gate:
    name: Required / Remediation
    if: always()
    needs: [verify, secrets, startup]
    runs-on: ubuntu-latest
    steps:
      - name: Require all baseline checks to pass
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
          STARTUP_RESULT: ${{ needs.startup.result }}
        run: test "$VERIFY_RESULT" = success && test "$SECRETS_RESULT" = success && test "$STARTUP_RESULT" = success
